{% extends "tasks/base.html" %}

{% block title %}Excluir tag{% endblock %}

{% block content %}
<h1 class="mb-4">Excluir tag</h1>

<div class="card p-4">
  <p>Tem certeza que deseja excluir esta tag?</p>

  <blockquote class="blockquote">
    {{ object.name }}
  </blockquote>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
      Sim, excluir
    </button>

    <a href="{% url 'tasks:tag-list' %}" class="btn btn-secondary">
      Cancelar
    </a>
  </form>
</div>
{% endblock %}
