<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Todo List{% endblock %}</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f5f7fb;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 230px;
      background: #1f2937;
      color: white;
      padding: 24px 16px;
    }

    .sidebar h2 {
      font-size: 22px;
      margin-bottom: 24px;
    }

    .sidebar a {
      display: block;
      color: #d1d5db;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .sidebar a:hover {
      background: #374151;
      color: white;
    }

    .content {
      flex: 1;
      padding: 32px;
    }

    .task-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .done-task {
      opacity: 0.72;
    }

    .tag-pill {
      display: inline-block;
      background: #e5e7eb;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Todo List</h2>
      <a href="{% url 'tasks:index' %}">Página inicial</a>
      <a href="{% url 'tasks:tag-list' %}">Tags</a>
    </aside>

    <main class="content">
      {% block content %}
      {% endblock %}
    </main>
  </div>
</body>
</html>
